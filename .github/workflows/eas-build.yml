name: EAS Build

on:
  # Manual only: building on every main push burned EAS free-tier minutes.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS ${{ github.event.inputs.profile || 'preview' }} — ${{ github.event.inputs.platform || 'all' }}
    runs-on: ubuntu-latest
    # Skip in forks, which lack the EXPO_TOKEN secret.
    if: github.repository == 'Loyus-App/Loyus'
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: yarn install --immutable

      - name: Build (non-interactive, no-wait)
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --non-interactive \
            --no-wait
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
