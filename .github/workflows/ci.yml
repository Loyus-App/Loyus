name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'loyus-arc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - name: Biome check
        run: yarn check

  typecheck:
    name: Typecheck
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'loyus-arc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - name: tsc --noEmit
        run: yarn typecheck

  test:
    name: Unit tests (Jest)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'loyus-arc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - name: Jest with coverage
        run: npx jest --coverage --ci
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/
          retention-days: 14
