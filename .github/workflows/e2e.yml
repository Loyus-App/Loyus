name: E2E Tests (Maestro)

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "assets/**"
      - "app.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".maestro/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      XCODE_VERSION: "27"
      SIMULATOR: "iPhone 17"

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: yarn install --immutable

      - uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-xc${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-xc${{ env.XCODE_VERSION }}-

      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-xc${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Podfile.lock') }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            derived-data-${{ runner.os }}-xc${{ env.XCODE_VERSION }}-${{ hashFiles('ios/Podfile.lock') }}-
            derived-data-${{ runner.os }}-xc${{ env.XCODE_VERSION }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR" -b

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=$(cat .maestro/maestro-version)
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build E2E dev-client
        run: npx expo run:ios --device "$SIMULATOR" --configuration Release
        env:
          EXPO_PUBLIC_E2E: "true"
          CI: "true"

      - name: Run Maestro tests
        run: |
          maestro test \
            --format junit \
            --output .maestro/reports/report.xml \
            --test-output-dir .maestro/reports \
            .maestro/

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ github.run_id }}
          path: .maestro/reports/
          retention-days: 7
