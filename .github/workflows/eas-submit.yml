# Builds production binaries on EAS and submits them to TestFlight and the Play internal track.
name: EAS Submit (Release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to submit
        required: true
        default: all
        type: choice
        options: [all, ios, android]
      skip_build:
        description: Submit the latest finished production build (skip a fresh build)
        required: false
        default: false
        type: boolean

concurrency:
  group: eas-submit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  release:
    name: Build + submit
    needs: verify
    runs-on: ubuntu-latest
    if: github.repository == 'Loyus-App/Loyus'
    environment: production
    permissions:
      contents: write
    env:
      PLATFORM: ${{ inputs.platform || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: yarn install --immutable

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version=$(npx expo config --json | jq -r .version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.config.ts version $version"
            exit 1
          fi

      - name: Build production
        if: ${{ !inputs.skip_build }}
        run: |
          eas build \
            --profile production \
            --platform "$PLATFORM" \
            --non-interactive \
            --json > builds.json
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"

      - name: Use latest finished production builds
        if: ${{ inputs.skip_build }}
        run: |
          eas build:list \
            --build-profile production \
            --platform "$PLATFORM" \
            --status finished \
            --limit 20 \
            --non-interactive \
            --json > builds.json

      - name: Resolve build IDs
        id: builds
        run: |
          for platform in ios android; do
            id=$(jq -r --arg p "$platform" 'map(select(.platform == ($p | ascii_upcase))) | max_by(.createdAt) | .id // empty' builds.json)
            echo "$platform=$id" >> "$GITHUB_OUTPUT"
            echo "$platform build: ${id:-none}"
          done

      - name: Submit iOS to TestFlight
        if: steps.builds.outputs.ios != ''
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --id ${{ steps.builds.outputs.ios }} \
            --non-interactive \
            --wait

      - name: Submit Android to Play internal track (draft)
        if: ${{ !cancelled() && steps.builds.outputs.android != '' }}
        run: |
          eas submit \
            --platform android \
            --profile production \
            --id ${{ steps.builds.outputs.android }} \
            --non-interactive \
            --wait

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
