name: Install
description: Node 24, Yarn through Corepack, then the locked dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: yarn
    - run: yarn install --immutable
      shell: bash
