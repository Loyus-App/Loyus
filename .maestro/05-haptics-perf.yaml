appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "Perf Test"
      CARD_CODE: "1234567890128"
      CARD_FORMAT_LABEL: "EAN-13"
- assertVisible:
    text: "Perf Test"
- tapOn:
    id: "card-grid-tile"
- extendedWaitUntil:
    visible:
      id: "barcode-display"
    timeout: 8000
- tapOn:
    text: "Close card"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- tapOn:
    text: "List"
- extendedWaitUntil:
    visible:
      id: "card-list-item"
    timeout: 5000
- longPressOn:
    id: "card-list-item"
- tapOn:
    text: "Cancel"
- tapOn:
    text: "Grid"
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- tapOn:
    text: "Cards"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- takeScreenshot: "05-haptics-perf-full-flow"
