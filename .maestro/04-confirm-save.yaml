appId: com.loyus.app
name: "04 - Scan confirmation saves card"
---
- runFlow: shared/launch-fresh.yaml
- openLink: "loyus:///card/confirm?code=3250390000112&format=EAN13"
- extendedWaitUntil:
    visible:
      id: "confirm-screen"
    timeout: 8000
- assertVisible:
    id: "card-code-input"
- tapOn:
    id: "card-name-input"
- inputText: "Test Scanned Card"
- tapOn:
    id: "save-card-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 8000
- assertVisible:
    text: "Test Scanned Card"
- assertVisible:
    id: "card-grid-tile"
