appId: com.loyus.app
name: "04 - Rotating code shows warning"
---
- runFlow: shared/launch-fresh.yaml
- openLink: "loyus:///card/confirm?code=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0&format=QR_CODE"
- extendedWaitUntil:
    visible:
      id: "confirm-screen"
    timeout: 8000
- assertVisible:
    id: "rotating-code-warning"
- assertVisible:
    text: "This code looks temporary.*"
