appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "ToDelete"
      CARD_CODE: "999888777"
      CARD_FORMAT_LABEL: "Code 128"
- assertVisible:
    text: "ToDelete"
- longPressOn:
    id: "card-grid-tile"
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    visible:
      text: "Delete this card?"
    timeout: 5000
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- assertNotVisible:
    text: "ToDelete"
- assertVisible:
    id: "empty-state-cta"
