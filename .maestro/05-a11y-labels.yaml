appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "A11yCard"
      CARD_CODE: "12345678"
      CARD_FORMAT_LABEL: "Code 128"
- assertVisible:
    text: "A11yCard, Code 128"
- tapOn:
    text: "A11yCard"
- extendedWaitUntil:
    visible:
      id: "card-detail-name"
    timeout: 8000
- assertVisible:
    id: "barcode-display"
- assertVisible:
    text: "Close card"
- assertVisible:
    text: "More actions"
- tapOn:
    text: "Close card"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- takeScreenshot: "05-a11y-labels-settings"
