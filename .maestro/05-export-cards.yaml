appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "Export Test Card"
      CARD_CODE: "1234567890128"
      CARD_FORMAT_LABEL: "EAN-13"
- assertVisible:
    text: "Export Test Card"
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- tapOn:
    id: "export-cards-row"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "05-export-share-sheet"
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
