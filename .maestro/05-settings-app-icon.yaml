appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "app-icon-row"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "app-icon-row"
- extendedWaitUntil:
    visible:
      id: "app-icon-screen"
    timeout: 5000
- assertVisible:
    text: "Night.*"
- assertVisible:
    text: "Ocean"
