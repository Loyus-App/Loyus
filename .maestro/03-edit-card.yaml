appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "OldName"
      CARD_CODE: "ABC123"
      CARD_FORMAT_LABEL: "Code 128"
- assertVisible:
    text: "OldName"
- tapOn:
    text: "OldName"
- extendedWaitUntil:
    visible:
      id: "card-detail-name"
    timeout: 8000
- assertVisible:
    id: "barcode-display"
- tapOn:
    text: "More actions"
- tapOn:
    text: "Edit"
- extendedWaitUntil:
    visible:
      id: "card-name-input"
    timeout: 8000
- tapOn:
    id: "card-name-input"
- eraseText:
    charactersToErase: 20
- inputText: "NewName"
- tapOn:
    id: "save-card-button"
- extendedWaitUntil:
    visible:
      id: "card-detail-name"
    timeout: 8000
- assertVisible:
    text: "NewName"
- tapOn:
    text: "Close card"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- assertVisible:
    text: "NewName"
- assertNotVisible:
    text: "OldName"
