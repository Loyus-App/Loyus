appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible:
    id: "theme-system"
- assertVisible:
    id: "theme-light"
- assertVisible:
    id: "theme-dark"
- tapOn:
    id: "theme-dark"
- takeScreenshot: "05-settings-theme-dark"
- tapOn:
    id: "theme-light"
- takeScreenshot: "05-settings-theme-light"
- tapOn:
    id: "theme-system"
- tapOn:
    id: "language-row"
- extendedWaitUntil:
    visible:
      text: "Same as the phone"
    timeout: 5000
- assertVisible:
    text: "English"
- assertVisible:
    text: "Français"
- tapOn:
    text: "Same as the phone"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- assertVisible:
    id: "max-brightness-switch"
- assertVisible:
    id: "export-cards-row"
- assertVisible:
    id: "restore-backup-row"
- assertVisible:
    id: "privacy-policy-row"
- assertVisible:
    id: "about-version"
