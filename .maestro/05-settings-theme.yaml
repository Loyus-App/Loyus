appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible:
    id: "identity-card"
- assertVisible:
    text: ".*No backup yet"
- assertVisible:
    id: "export-cards-row"
- assertVisible:
    id: "restore-backup-row"
- scrollUntilVisible:
    element:
      id: "max-brightness-switch"
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element:
      text: "System"
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Dark"
- takeScreenshot: "05-settings-theme-dark"
- tapOn:
    text: "Light"
- takeScreenshot: "05-settings-theme-light"
- tapOn:
    text: "System"
- scrollUntilVisible:
    element:
      id: "language-row"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "language-row"
- extendedWaitUntil:
    visible:
      text: "Same as the phone.*"
    timeout: 5000
- assertVisible:
    text: "English"
- assertVisible:
    text: "Français"
- tapOn:
    text: "Same as the phone.*"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-version"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "about-row"
- extendedWaitUntil:
    visible:
      id: "about-screen"
    timeout: 5000
- assertVisible:
    id: "about-version"
- assertVisible:
    id: "privacy-policy-row"
