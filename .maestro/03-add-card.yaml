appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- assertVisible:
    id: "empty-state-cta"
- tapOn:
    id: "empty-state-cta"
- extendedWaitUntil:
    visible:
      id: "scan-screen"
    timeout: 8000
- assertVisible:
    text: "No camera available"
- tapOn:
    id: "manual-entry-button"
- extendedWaitUntil:
    visible:
      id: "card-name-input"
    timeout: 8000
- assertVisible:
    id: "card-preview"
- tapOn:
    id: "card-name-input"
- inputText: "Carrefour"
- pressKey: Enter
- inputText: "3250390000112"
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "format-picker"
- tapOn:
    id: "format-picker"
- tapOn:
    text: "EAN-13"
- waitForAnimationToEnd
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 8000
- assertVisible:
    text: "Carrefour.*"
- assertVisible:
    text: "ALL CARDS · 1"
