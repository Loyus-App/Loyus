appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- assertVisible:
    id: "empty-state-cta"
- tapOn:
    id: "empty-state-cta"
- extendedWaitUntil:
    visible:
      id: "scan-screen"
    timeout: 8000
- assertVisible:
    text: "No camera available"
- tapOn:
    id: "manual-entry-button"
- extendedWaitUntil:
    visible:
      id: "card-name-input"
    timeout: 8000
- assertVisible:
    id: "card-preview"
- tapOn:
    id: "card-name-input"
- inputText: "Carrefour"
- tapOn:
    id: "card-code-input"
- inputText: "3250390000112"
- tapOn:
    id: "format-picker"
- assertVisible:
    text: "Choose the barcode type"
- tapOn:
    text: "EAN-13"
- tapOn:
    id: "save-card-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 8000
- assertVisible:
    text: "Carrefour"
- assertVisible:
    text: "ALL CARDS · 1"
