appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "TestStore"
      CARD_CODE: "2001234567893"
      CARD_FORMAT_LABEL: "EAN-13"
- tapOn:
    text: "TestStore"
- extendedWaitUntil:
    visible:
      id: "barcode-display"
    timeout: 8000
- assertVisible:
    id: "card-detail-name"
- assertVisible:
    id: "barcode-card"
- assertVisible:
    id: "card-number"
- assertVisible:
    text: "Brightness at maximum"
- tapOn:
    id: "rotate-button"
- assertVisible:
    id: "barcode-card"
- tapOn:
    id: "copy-number-button"
- assertVisible:
    text: "Copied"
