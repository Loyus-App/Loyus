appId: com.loyus.app
---
- runFlow: shared/launch-fresh.yaml
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "Carrefour"
      CARD_CODE: "1111111"
      CARD_FORMAT_LABEL: "Code 128"
- runFlow:
    file: shared/add-card-manual.yaml
    env:
      CARD_NAME: "Leclerc"
      CARD_CODE: "2222222"
      CARD_FORMAT_LABEL: "Code 128"
- assertVisible:
    text: "Carrefour"
- assertVisible:
    text: "Leclerc"
- tapOn:
    text: "Carrefour"
- extendedWaitUntil:
    visible:
      id: "card-detail-name"
    timeout: 8000
- tapOn:
    text: "Close card"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000
- tapOn:
    text: "Search"
- extendedWaitUntil:
    visible:
      id: "search-screen"
    timeout: 8000
- assertVisible:
    text: "RECENTLY USED"
- assertVisible:
    text: "Carrefour"
- tapOn:
    text: "Store, owner or number"
- inputText: "Leclerc"
- extendedWaitUntil:
    visible:
      id: "search-result"
    timeout: 5000
- assertVisible:
    text: "Leclerc"
- assertNotVisible:
    text: "Carrefour"
- eraseText:
    charactersToErase: 20
- inputText: "Zzz"
- assertVisible:
    text: "No card matches"
